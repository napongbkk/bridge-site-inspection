<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bridge Inspect">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Bridge Site Inspection</title>
<style>
/* Layout: soft, light field app — pastel cards, pill controls, round icon buttons, week strip,
   horizontal "in progress" cards, bottom tab bar with a centre + button. Max width 760px.
   Palette: near-white ground, white cards with soft shadows, near-black ink, golden-yellow highlight,
   one pastel per bridge type. System fonts so it works offline. */
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#16181D; --muted:#7A808C; --line:#ECEEF2; --well:#EEF0F4;
  --accent:#16181D; --accent-ink:#FFFFFF;                 /* primary buttons: black pills */
  --hi:#F6BB2C; --hi-ink:#16181D; --accent-line:#F6BB2C;  /* selected / highlight: golden yellow */
  --link:#2F6FDE; --danger:#E5484D; --field:#FFFFFF; --field-line:#E6E8EE; --press:#F7F8FA;
  --ok:#DFF3E5; --ok-ink:#1D6B3A; --def:#FFE4CC; --def-ink:#9A4A0B; --def-bar:#F08A3E;
  --t-timber:#FDE8DA; --t-timber-ink:#B8582A; --t-concrete:#E3ECFA; --t-concrete-ink:#2F62B0;
  --t-steel:#ECE6FA; --t-steel-ink:#6A4FC0; --t-underpass:#E0F3E8; --t-underpass-ink:#2B8653; --t-custom:#FDE7EF; --t-custom-ink:#B4386A;
  --shadow:0 6px 22px rgba(22,24,29,.07); --shadow-sm:0 2px 8px rgba(22,24,29,.06);
  --r:20px;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1115; --card:#1A1D23; --ink:#F2F3F5; --muted:#9097A3; --line:#262A32; --well:#22262E;
  --accent:#F2F3F5; --accent-ink:#0F1115; --hi:#F6BB2C; --hi-ink:#16181D; --accent-line:#F6BB2C;
  --link:#7FA8FF; --danger:#FF6B6B; --field:#15181D; --field-line:#2A2F38; --press:#20242B;
  --ok:#1E3A28; --ok-ink:#9BE3B2; --def:#3D2A1A; --def-ink:#FFB27A; --def-bar:#E58A45;
  --t-timber:#3A2A20; --t-timber-ink:#F2A776; --t-concrete:#1F2C42; --t-concrete-ink:#8DB4F5;
  --t-steel:#2A2440; --t-steel-ink:#B9A4F5; --t-underpass:#1B3326; --t-underpass-ink:#86D6A6; --t-custom:#3A1F2A; --t-custom-ink:#F29BBE;
  --shadow:0 6px 22px rgba(0,0,0,.35); --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Top bar (inner screens): round back button, title, sync status */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--bg) 92%, transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:760px;margin:0 auto;padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;min-height:60px}
.bar h1{flex:1;margin:0;font-size:17px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:42px;height:42px;flex:0 0 auto;border:0;border-radius:50%;background:var(--card);box-shadow:var(--shadow-sm);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.back span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--card);padding:7px 11px;border-radius:999px;box-shadow:var(--shadow-sm)}
.dot{width:8px;height:8px;border-radius:50%;background:#34C17A}
.save[data-s="saving"] .dot{background:var(--hi)} .save[data-s="error"] .dot{background:var(--danger)} .save[data-s="wait"] .dot{background:var(--def-bar)}
body.home .bar{display:none}

main{max-width:760px;margin:0 auto;padding:12px max(16px, env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
body.has-tabs main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.home main{padding-top:calc(14px + env(safe-area-inset-top,0px))}
h2.big{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;text-wrap:balance}
h2.hero{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.15;text-wrap:balance}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:0;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card.hot{box-shadow:var(--shadow),inset 0 0 0 2px var(--hi)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px;color:var(--ink)}
.sec-h .more{border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:6px 0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* Buttons: pills */
.btn{min-height:50px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
.btn.dark{background:var(--accent);color:var(--accent-ink)}
.btn.yellow{background:var(--hi);color:var(--hi-ink)}
.btn.out{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--field-line)}
.btn.ghost{background:transparent;color:var(--ink)} .btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn:active,.tap:active,.tile:active,.icb:active{transform:scale(.98)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.tap:focus-visible,.back:focus-visible,.tile:focus-visible,.icb:focus-visible,.day:focus-visible,.tabs button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.icb{width:44px;height:44px;flex:0 0 auto;border:0;border-radius:50%;background:var(--card);box-shadow:var(--shadow-sm);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;position:relative}
.icb.yellow{background:var(--hi);color:var(--hi-ink)}
.icb.soft{background:var(--well);box-shadow:none}
.icb .badge-dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--def-bar);box-shadow:0 0 0 2px var(--card)}

/* Segmented control: soft track, white thumb */
.seg{display:flex;gap:4px;padding:4px;background:var(--well);border-radius:999px}
.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font-size:14px;cursor:pointer;padding:0 8px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--shadow-sm);font-size:14px;cursor:pointer;white-space:nowrap;flex:0 0 auto;color:var(--ink)}
.chips.loc .chip{min-height:38px;padding:0 13px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);font-weight:700}
.chips.loc .chip.alldone{background:var(--ok);color:var(--ok-ink);font-weight:700}
.chips.loc .chip.alldone[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ok-ink)}
.chips.loc .chip svg{width:14px;height:14px;vertical-align:-2px}
.chip.okc[aria-pressed="true"]{background:var(--ok);color:var(--ok-ink)}
.chip.nac[aria-pressed="true"]{background:var(--well);color:var(--ink)}
.cat{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:6px 18px 6px 6px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--shadow-sm);cursor:pointer;font-size:15px;font-weight:600;color:var(--ink)}
.cat .ci{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.cat[aria-pressed="true"]{box-shadow:var(--shadow-sm),inset 0 0 0 2px var(--hi)}

/* Badges and pills */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:56px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok);color:var(--ok-ink)} .b-def{background:var(--def);color:var(--def-ink)} .b-na{background:var(--well);color:var(--muted)} .b-note{background:var(--well)}
.b-todo{background:transparent;box-shadow:inset 0 0 0 1.5px var(--danger);color:var(--danger)}
.tap .badge.b-ok,.tap .badge.b-def,.tap .badge.b-na,.tap .badge.b-note{background:var(--ok);color:var(--ok-ink)}
.st-todo{color:var(--danger);font-weight:700} .st-done{color:var(--ok-ink);font-weight:700}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--well);white-space:nowrap}
.pill.hot{background:var(--hi);color:var(--hi-ink)}

/* Fields */
label.f{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
label.f span{font-size:13px;color:var(--muted);font-weight:600}
input.in,select.in,textarea.in{min-height:52px;border-radius:16px;border:0;box-shadow:inset 0 0 0 1px var(--field-line);background:var(--field);padding:0 16px;font-size:16px;width:100%}
textarea.in{min-height:104px;padding:14px 16px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;box-shadow:inset 0 0 0 2px var(--link)}
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 8px 0 20px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-sm)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;height:100%}
.search svg{color:var(--muted);flex:0 0 auto;margin-right:10px}

/* Lists */
.tap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;padding:12px 14px;min-height:64px;cursor:pointer;box-shadow:var(--shadow-sm);color:var(--ink)}
.tap:hover{background:var(--press)}
.tap.just{box-shadow:var(--shadow-sm),inset 0 0 0 2px var(--hi)}
.code{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted);width:58px;flex:0 0 auto}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.facts div{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow-sm)}
.facts b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
@media (min-width:640px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prog{height:10px;border-radius:999px;background:var(--well);overflow:hidden;display:flex} .prog i{display:block;height:100%}
.step{display:flex;align-items:center;gap:10px;min-height:56px}
.step span.l{flex:1;font-weight:600}
.step button{width:44px;height:44px;border-radius:50%;border:0;background:var(--well);font-size:22px;cursor:pointer;color:var(--ink)}
.step b{width:34px;text-align:center;font-family:var(--mono);font-size:18px}

/* Home: greeting, week strip, in-progress cards, bridge rows */
.hello{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--hi);color:var(--hi-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--card);border-radius:var(--r);padding:12px 8px;box-shadow:var(--shadow-sm)}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border:0;border-radius:999px;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;position:relative}
.day b{font-size:16px;color:var(--ink);font-weight:700}
.day[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink)} .day[aria-pressed="true"] b{color:var(--hi-ink)}
.day.has::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--def-bar)}
.day[aria-pressed="true"].has::after{background:var(--hi-ink)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.icard{flex:0 0 min(70%, 230px);scroll-snap-align:start;border:0;border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.icard .top{display:flex;justify-content:space-between;align-items:center}
.icard .ring{font-size:12px;font-weight:700;background:var(--card);border-radius:999px;padding:4px 9px}
.icard b{font-size:16px;color:var(--ink)}
.icard .sub{color:var(--ink);opacity:.7}
.icard .bar2{height:6px;border-radius:999px;background:color-mix(in srgb, var(--card) 70%, transparent);overflow:hidden} .icard .bar2 i{display:block;height:100%;background:var(--ink)}
.brow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:0;border-radius:var(--r);padding:14px;box-shadow:var(--shadow-sm);text-align:left;cursor:pointer;color:var(--ink)}
.brow .when{display:inline-flex;align-items:center;gap:6px;background:var(--well);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink);margin-top:8px}
.ticon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;flex:0 0 auto}
.t-timber{background:var(--t-timber);color:var(--t-timber-ink)} .t-concrete{background:var(--t-concrete);color:var(--t-concrete-ink)}
.t-steel{background:var(--t-steel);color:var(--t-steel-ink)} .t-underpass{background:var(--t-underpass);color:var(--t-underpass-ink)} .t-custom{background:var(--t-custom);color:var(--t-custom-ink)}
.tico{display:inline-flex}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.folders{grid-template-columns:repeat(3,minmax(0,1fr))}}
.folder{display:flex;flex-direction:column;gap:10px;padding:10px;border:0;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;color:var(--ink);min-width:0}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--well)}
.mosaic img,.mosaic span{width:100%;height:100%;object-fit:cover;display:block;background:var(--well)}
.ftitle{display:flex;align-items:center;gap:8px;min-width:0}
.ftitle b{font-size:15px}
.fic{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.fic svg{width:16px;height:16px}
.spill{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.spill svg{width:14px;height:14px}
.spill.ok{background:var(--ok);color:var(--ok-ink)} .spill.wait{background:var(--def);color:var(--def-ink)} .spill.off{background:var(--well);color:var(--muted)}
.psync{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.psync svg{width:15px;height:15px}
.psync.ok{background:#34C17A;color:#fff} .psync.wait{background:var(--def-bar);color:#fff} .psync.off{background:#9AA1AD;color:#fff}
.lb{position:fixed;inset:0;z-index:20;background:#0B0C0F;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.lb-count{font-size:14px;opacity:.8}
.lb-btn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.lb-btn:disabled{opacity:.3}
.lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 6px}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb-info{display:flex;flex-direction:column;gap:6px;padding:14px 16px 12px;max-width:760px;width:100%;margin:0 auto;font-size:14px}
.lb-sub{opacity:.75;font-size:13px}
.syncbox{flex-direction:row;align-items:center;gap:12px;padding:12px 12px 12px 16px}
.syncbox b{font-size:15px}
.sdot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;background:#34C17A;box-shadow:0 0 0 4px color-mix(in srgb, #34C17A 20%, transparent)}
.sdot.wait{background:var(--def-bar);box-shadow:0 0 0 4px color-mix(in srgb, var(--def-bar) 22%, transparent)}
.sdot.busy{background:var(--hi);box-shadow:0 0 0 4px color-mix(in srgb, var(--hi) 25%, transparent)}
.sdot.off{background:#9AA1AD;box-shadow:0 0 0 4px color-mix(in srgb, #9AA1AD 22%, transparent)}
.sdot.err{background:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb, var(--danger) 20%, transparent)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} .tiles .tile.t-custom{grid-column:1/-1}
@media (max-width:340px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:16px;text-align:left;padding:16px;border:0;border-radius:var(--r);cursor:pointer;min-height:132px;color:var(--ink)}
.tile .ticon{background:var(--card)}
.tile b{font-size:16px;font-weight:800}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:16px;overflow:hidden;background:var(--well);border:0;padding:0;cursor:pointer;display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .pname{position:absolute;left:6px;right:6px;bottom:6px;padding:3px 7px;background:rgba(0,0,0,.55);color:#fff;font-family:var(--mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px}
.ph button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:16px;line-height:1}

.warn{background:color-mix(in srgb, var(--hi) 16%, var(--card));box-shadow:var(--shadow-sm)}
.fin{border:2px solid var(--ink)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--well)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:9;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
.stick{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top, var(--bg) 70%, transparent)}

/* Bottom tab bar with centre + */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:520px;margin:0 auto;height:68px;background:var(--card);border-radius:26px;box-shadow:0 8px 30px rgba(22,24,29,.12);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tabs button{border:0;background:transparent;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--hi)}
.tabs .plus{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin:-26px auto 0;box-shadow:0 8px 20px rgba(22,24,29,.25);font-size:0}
.tabs .plus svg{color:var(--accent-ink)!important}

/* Bottom sheet (share, new bridge) */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:'';display:block;width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 12px}
.sheet-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Picture report (PC) */
.lockc .lock-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--well);flex:0 0 auto}
.sec-h .more svg{width:14px;height:14px;vertical-align:-2px}
.mg-items{display:flex;flex-wrap:wrap;gap:6px}
.mg-it{display:inline-flex;align-items:center;gap:6px;background:var(--well);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px}
.mg-it button{border:0;background:var(--card);color:var(--ink);width:24px;height:24px;border-radius:999px;cursor:pointer;font-size:11px}
.credit a{color:inherit}
.credit{margin:8px 0 0;text-align:center;font-size:12px;letter-spacing:.04em;color:var(--muted);opacity:.85}
body.wide .credit{grid-column:1/-1;padding:12px 0 20px}
.desk-only{display:none} @media (min-width:900px){.desk-only{display:flex}}
.pr-cta{align-items:center;gap:16px;width:100%;padding:16px 18px;border:0;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s}
.pr-cta:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(22,24,29,.10)}
.pr-cta:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.pr-cta-ic{flex:0 0 auto;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--hi);color:var(--hi-ink)}
.pr-cta-ic svg{width:26px;height:26px}
.pr-cta-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pr-cta-tx b{font-size:16px} .pr-cta-tx span{font-size:13.5px;color:var(--muted)}
.pr-cta-go{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:10px 14px 10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px}
body.wide main{max-width:none;padding:0;gap:0} body.wide .bar-in{max-width:none}
.pr{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 62px)}
.pr-side{position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto;padding:16px;background:var(--card);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px}
.pr-side>*,.pr-side>label.f{flex:0 0 auto}
.pr-loc h4{margin:6px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pr-el{border-radius:14px;background:var(--well);margin-bottom:6px;overflow:hidden}
.pr-eh{display:flex;align-items:center;cursor:grab}
.pr-et{flex:1;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-align:left;padding:10px 4px 10px 10px;cursor:pointer;min-height:44px}
.pr-et svg{transition:transform .15s;flex:0 0 auto} .pr-el.open .pr-et svg{transform:rotate(90deg)}
.pr-cnt{font-size:12px;color:var(--muted);font-weight:600} .pr-cnt.all{color:var(--ok-ink)}
.pr-plus{border:0;background:var(--card);color:var(--ink);width:32px;height:32px;border-radius:10px;margin-right:6px;font-size:18px;cursor:pointer} .pr-plus:disabled{opacity:.35;cursor:default}
.pr-thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 8px 10px}
.pr-th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);cursor:grab}
.pr-th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pr-th .pname{font-size:9.5px}
.pr-th.used img{opacity:.45}
.pr-add,.pr-num{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:999px;border:0;display:grid;place-items:center;font-size:15px;font-weight:800;line-height:1}
.pr-add{background:var(--ink);color:var(--bg);cursor:pointer} .pr-num{background:var(--ok);color:var(--ok-ink);font-size:12px}
.pr-work{padding:0 24px 60px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pr-tools{position:sticky;top:62px;z-index:3;background:var(--bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0}
.pr-tools .in{min-height:40px}
.pr-pages{display:flex;flex-direction:column;align-items:center;gap:24px;overflow-x:auto;padding-bottom:20px}
.pg{position:relative;flex:0 0 auto;box-sizing:border-box;width:calc(210 * var(--mm));height:calc(297 * var(--mm));padding:calc(20 * var(--mm));background:#fff;color:#111;box-shadow:0 2px 16px rgba(0,0,0,.14);display:flex;flex-direction:column;overflow:hidden}
.pg.ghost{opacity:.75}
.pg-head{position:absolute;top:calc(10 * var(--mm));left:calc(20 * var(--mm));right:calc(20 * var(--mm));text-align:center;font:calc(3.2 * var(--mm))/1.2 Calibri,Arial,sans-serif;color:#555}
.pg-no{position:absolute;bottom:calc(8 * var(--mm));right:calc(20 * var(--mm));font:calc(3.2 * var(--mm)) Calibri,Arial,sans-serif;color:#555}
.pr-fig{margin:0 0 calc(4 * var(--mm));position:relative;display:flex;flex-direction:column;align-items:center;border-radius:6px;outline:2px dashed transparent;outline-offset:2px;cursor:grab}
.pr-fig:hover,.pr-fig:focus-within{outline-color:#c3c9d2}
.pr-fig.dragging{opacity:.4}
.pr-fig img{display:block;width:auto;height:auto;background:#eee;min-width:calc(20 * var(--mm));min-height:calc(15 * var(--mm))}
.pr-fig figcaption{font:700 calc(3.53 * var(--mm))/1.25 Calibri,Arial,sans-serif;text-align:center;margin-top:calc(1 * var(--mm));max-width:100%;color:#111;cursor:text}
.pr-cap{outline:none;border-bottom:1px dashed transparent;padding:0 2px} .pr-cap:hover{border-bottom-color:#9aa3ad} .pr-cap:focus{background:#fff7d6;border-bottom-color:#16181d}
.pr-reset{border:0;background:#eef0f3;border-radius:6px;cursor:pointer;font-size:12px;padding:1px 6px;color:#333}
.pr-ft{position:absolute;top:6px;right:6px;display:none;gap:6px;align-items:center;background:var(--card);color:var(--ink);border-radius:12px;padding:6px 8px;box-shadow:0 4px 16px rgba(0,0,0,.18);font:600 12px system-ui,sans-serif;z-index:2;cursor:default}
.pr-fig:hover .pr-ft,.pr-fig:focus-within .pr-ft{display:flex}
.pr-ft label{display:flex;align-items:center;gap:6px} .pr-ft input[type=range]{width:110px;accent-color:var(--ink)}
.pr-ft button{border:0;background:var(--well);color:var(--ink);border-radius:8px;min-width:28px;height:28px;padding:0 8px;font:inherit;cursor:pointer} .pr-ft button:disabled{opacity:.35}
.pr-dim{color:var(--muted);min-width:84px}
.pr-drop{flex:1;min-height:calc(30 * var(--mm));border:2px dashed #c3c9d2;border-radius:12px;display:grid;place-items:center;color:#6b7380;font:600 14px system-ui,sans-serif;text-align:center;padding:12px}
.pr-drop.over{border-color:var(--link);background:rgba(47,111,222,.07);color:var(--link)}
.pr-fig.over-top{box-shadow:0 -5px 0 var(--link)} .pr-fig.over-bot{box-shadow:0 5px 0 var(--link)}
@media (max-width:899px){.pr{grid-template-columns:1fr}.pr-side{position:static;height:auto;max-height:55vh}.pr-work{padding:0 12px 40px}.pr-tools{top:62px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
'use strict';
/* =========================================================================
   Bridge templates. Each type builds its own component list (numbering in the direction of
   increasing SLK; piers ascending from A1; piles, girders and columns left to right facing
   increasing SLK). `ph` = photo file name.
   ========================================================================= */
const ICONS = {
  timber: '<path d="M3 12h58M3 9h58M9 12v24M25 12v24M41 12v24M57 12v24M9 18l16 12M25 18L9 30M41 18l16 12M57 18L41 30"/>',
  concrete: '<path d="M3 8h58v7H3zM10 15l6 5h32l6-5M22 20v16M42 20v16M17 36h10M37 36h10"/>',
  steel: '<path d="M3 26h58M3 26L11 8h42l8 18M11 8l8 18 9-18 8 18 9-18 8 18M15 26v10M49 26v10"/>',
  underpass: '<path d="M3 8h58M3 13h58M14 36V18h36v18M18 36V22h28v14M3 36h58M28 31h8"/>',
  custom: '<path d="M3 10h58M3 15h58M9 15v21M55 15v21M24 21l14 14M38 21l3 3-14 14h-3v-3z"/>',
};
const TEMPLATES = {
  timber: {
    name: 'Timber bridge', blurb: 'Stringers, halfcaps, corbels, timber piles, sheeting abutments',
    params: [['spans', 'Spans', 1, 30, 3], ['stringersPerSpan', 'Stringers per span', 1, 12, 5], ['pilesPerPier', 'Piles per pier', 1, 12, 4], ['abutPiles', 'Piles per abutment', 0, 12, 4]],
    choices: [['abutType', 'Abutment type', [['sheeting', 'Sill beam + sheeting'], ['bedlog', 'Bedlog']]], ['corbels', 'Corbels at piers', [['yes', 'Yes'], ['no', 'No']]]],
    defects: ['White rot', 'Brown rot', 'Soft rot', 'Friable timber', 'Termite attack', 'Marine borer', 'Pipe / cavity', 'Splitting', 'Crushing', 'Poor seating', 'Fire damage', 'Weathering', 'Loose / missing fastener', 'Impact damage', 'Debris / vegetation'],
  },
  concrete: {
    name: 'Concrete bridge', blurb: 'Girders or slab deck, headstocks, columns, bearings, joints',
    params: [['spans', 'Spans', 1, 30, 3], ['girdersPerSpan', 'Girders per span (0 = slab deck)', 0, 20, 4], ['columnsPerPier', 'Columns per pier', 1, 8, 2]],
    choices: [],
    defects: ['Cracking', 'Spalling', 'Delamination', 'Exposed reinforcement', 'Corrosion staining', 'Efflorescence / leaching', 'Honeycombing', 'Scaling', 'Abrasion / erosion', 'Water seepage', 'Bearing defect', 'Joint defect', 'Impact damage', 'Scour', 'Debris / vegetation'],
  },
  steel: {
    name: 'Steel bridge', blurb: 'Steel girders, bracing, connections, coating, bearings',
    params: [['spans', 'Spans', 1, 30, 2], ['girdersPerSpan', 'Steel girders per span', 1, 20, 4], ['columnsPerPier', 'Columns per pier', 1, 8, 2]],
    choices: [['deckType', 'Deck', [['concrete', 'Concrete'], ['steel', 'Steel'], ['timber', 'Timber']]]],
    defects: ['Surface corrosion', 'Section loss', 'Coating breakdown', 'Cracking', 'Distortion / buckling', 'Loose / missing bolts or rivets', 'Weld defect', 'Bearing defect', 'Joint defect', 'Impact damage', 'Debris build-up', 'Bird / pest fouling', 'Scour'],
  },
  underpass: {
    name: 'Underpass', blurb: 'Entries, headwalls, walls, roof, floor, joints, drainage, lighting',
    params: [['units', 'Units / segments', 1, 40, 6]],
    choices: [['form', 'Structure form', [['box', 'Box units'], ['arch', 'Arch'], ['slab', 'Slab on walls']]]],
    defects: ['Cracking', 'Spalling', 'Exposed reinforcement', 'Water ingress / seepage', 'Efflorescence / leaching', 'Joint opening / failure', 'Settlement / misalignment', 'Drainage blocked', 'Ponding', 'Lighting fault', 'Graffiti / vandalism', 'Debris / litter', 'Scour at inlet / outlet', 'Impact damage'],
  },
  custom: {
    name: 'Manual bridge', tile: 'Manual set-up', blurb: 'Type your own locations and items',
    params: [], choices: [],
    defects: ['Cracking', 'Spalling', 'Exposed reinforcement', 'Corrosion', 'Section loss', 'Coating breakdown', 'Rot / decay', 'Splitting', 'Deformation', 'Loose / missing parts', 'Settlement / movement', 'Scour', 'Water ingress / seepage', 'Drainage blocked', 'Impact damage', 'Debris / vegetation', 'Graffiti / vandalism'],
  },
};
/* Manual set-up: the inspector types the locations and items. Location codes start with "M" and their
   names are kept in LOCN so labels, captions and the Word report show the typed names. */
const LOCN = {};
const safeName = t => String(t || '').replace(/[^A-Za-z0-9]+/g, '').slice(0, 24);
function refreshLocNames() { Store.all('bridges').forEach(b => (b.layout?.groups || []).forEach(g => { if (g.k !== 'GEN') LOCN[g.k] = g.name || 'Location'; })); }
const LEVELS = { 1: 'Level 1 · Routine', 2: 'Level 2 · Detailed' };
const typeOf = b => TEMPLATES[b?.type] ? b.type : 'timber';

function generateComponents(type, l) {
  const out = []; let order = 0;
  if (type === 'custom') {
    const used = new Set();
    (l.groups || []).forEach((g, gi) => {
      if (g.k !== 'GEN') LOCN[g.k] = g.name || 'Location';
      const pre = g.k === 'GEN' ? 'General' : (safeName(g.name) || 'Location' + gi);
      g.items.forEach((it, ii) => {
        let ph = pre + '_' + (safeName(it.name) || 'Item' + (ii + 1)); while (used.has(ph)) ph += 'x'; used.add(ph);
        out.push({ id: it.id, code: `${gi + 1}.${ii + 1}`, loc: g.k, o: gi, name: it.name, ph });
      });
    });
    return out;
  }
  const add = (loc, code, name, ph) => out.push({ id: code.replace(/\//g, '_'), code, loc, o: order, name, ph });
  const A = a => 'Abut' + a.slice(1), Sp = s => 'Span' + s.slice(1), Pi = p => 'Pier' + p.slice(1);
  const walkSpans = (abut, span, pier) => { order++; abut('A1'); for (let s = 1; s <= l.spans; s++) { order++; span('S' + s); if (s < l.spans) { order++; pier('P' + s); } } order++; abut('A2'); };

  if (type === 'timber') {
    add('GEN', 'GR', 'Guardrail / barriers', 'General_Guardrail');
    add('GEN', 'AP', 'Approach & expansion joint', 'General_Approach');
    walkSpans(a => {
      add(a, a + '-SH', 'Abutment sheeting', A(a) + '_Sheeting');
      add(a, a + '-WL', 'Wing wall sheeting LHS', A(a) + '_WingLHS');
      add(a, a + '-WR', 'Wing wall sheeting RHS', A(a) + '_WingRHS');
      l.abutType === 'bedlog' ? add(a, a + '-BL', 'Bedlog', A(a) + '_Bedlog') : add(a, a + '-SB', 'Sill beam', A(a) + '_SillBeam');
      add(a, a + '-HC', 'Halfcap', A(a) + '_Halfcap');
      for (let i = 1; i <= l.abutPiles; i++) add(a, `${a}/${i}`, `Pile ${i}`, `${A(a)}_P${i}`);
    }, s => {
      for (let i = 1; i <= l.stringersPerSpan; i++) add(s, `${s}-${i}`, `Stringer ${i}`, `${Sp(s)}_S${i}`);
      add(s, s + '-DK', 'Deck planks', Sp(s) + '_Deck');
      add(s, s + '-KL', 'Kerb LHS', Sp(s) + '_KerbLHS');
      add(s, s + '-KR', 'Kerb RHS', Sp(s) + '_KerbRHS');
    }, p => {
      add(p, p + '-HC', 'Halfcap', Pi(p) + '_Halfcap');
      if (l.corbels !== 'no') add(p, p + '-CB', 'Corbels', Pi(p) + '_Corbels');
      for (let i = 1; i <= l.pilesPerPier; i++) add(p, `${p}/${i}`, `Pile ${i}`, `${Pi(p)}_P${i}`);
      add(p, p + '-BR', 'Bracing / walers', Pi(p) + '_Bracing');
    });
  } else if (type === 'concrete' || type === 'steel') {
    const steel = type === 'steel';
    add('GEN', 'GR', 'Barriers / railings', 'General_Barriers');
    add('GEN', 'AP', 'Approach slabs', 'General_Approach');
    add('GEN', 'EJ', 'Expansion joints', 'General_ExpJoints');
    add('GEN', 'WS', 'Deck wearing surface', 'General_Surface');
    add('GEN', 'DR', 'Deck drainage', 'General_Drainage');
    walkSpans(a => {
      add(a, a + '-AW', 'Abutment wall / headstock', A(a) + '_Wall');
      add(a, a + '-WL', 'Wing wall LHS', A(a) + '_WingLHS');
      add(a, a + '-WR', 'Wing wall RHS', A(a) + '_WingRHS');
      add(a, a + '-BG', 'Bearings', A(a) + '_Bearings');
      add(a, a + '-FT', 'Footing / piles', A(a) + '_Footing');
      add(a, a + '-EM', 'Embankment & batter protection', A(a) + '_Embankment');
    }, s => {
      for (let i = 1; i <= l.girdersPerSpan; i++) add(s, `${s}-G${i}`, `${steel ? 'Steel girder' : 'Girder'} ${i}`, `${Sp(s)}_G${i}`);
      if (steel) {
        add(s, s + '-XB', 'Cross girders / bracing', Sp(s) + '_Bracing');
        add(s, s + '-CN', 'Connections & splices', Sp(s) + '_Connections');
        add(s, s + '-DK', { concrete: 'Concrete deck slab', steel: 'Steel deck', timber: 'Timber deck' }[l.deckType || 'concrete'], Sp(s) + '_Deck');
        add(s, s + '-PC', 'Protective coating', Sp(s) + '_Coating');
      } else {
        add(s, s + '-DS', l.girdersPerSpan ? 'Deck slab' : 'Deck slab (soffit)', Sp(s) + '_DeckSlab');
        if (l.girdersPerSpan) add(s, s + '-DI', 'Diaphragms', Sp(s) + '_Diaphragms');
      }
      add(s, s + '-KL', 'Kerb / footway LHS', Sp(s) + '_KerbLHS');
      add(s, s + '-KR', 'Kerb / footway RHS', Sp(s) + '_KerbRHS');
    }, p => {
      add(p, p + '-HS', 'Headstock', Pi(p) + '_Headstock');
      for (let i = 1; i <= l.columnsPerPier; i++) add(p, `${p}-C${i}`, `Column ${i}`, `${Pi(p)}_C${i}`);
      add(p, p + '-BG', 'Bearings', Pi(p) + '_Bearings');
      add(p, p + '-FT', 'Footing / piles', Pi(p) + '_Footing');
    });
  } else if (type === 'underpass') {
    const roof = { box: 'Roof slab', arch: 'Arch barrel', slab: 'Deck soffit' }[l.form || 'box'];
    add('GEN', 'GR', 'Barriers / handrails', 'General_Barriers');
    add('GEN', 'LT', 'Lighting', 'General_Lighting');
    add('GEN', 'SG', 'Signage & clearance markers', 'General_Signage');
    add('GEN', 'DR', 'Drainage & pumps', 'General_Drainage');
    const entry = e => { order++; const n = 'Entry' + e.slice(1);
      add(e, e + '-HW', 'Headwall / portal', n + '_Headwall');

window.addEventListener('popstate', e => {
  if (!$('#lightbox').hidden) lbClose();
  // Each app screen is one history entry, so the Android back gesture/button steps back one screen.
  const idx = e.state?.idx || 0;
  if (idx >= S.hIdx) { S.hIdx = idx; return; }   // a forward step (rare on phones) is ignored
  leaveComponent();

const itemsOf = insp => insp.items || {};
function photosOf(insp, cid) { const all = live(insp.photos).map(([id, p]) => ({ id, ...p })); return cid ? all.filter(p => p.componentId === cid) : all; }
function statusOf(it, nPhotos) {
  it = it || {};
  if (it.na) return { label: 'N/A', cls: 'b-na', done: true };
  if ((it.defects || []).length) return { label: `${it.defects.length} defect${it.defects.length > 1 ? 's' : ''}`, cls: 'b-def', done: true, def: true };
  if (it.none) return { label: 'No defects', cls: 'b-ok', done: true };
  if (it.comment || nPhotos) return { label: 'Noted', cls: 'b-note', done: true };
  return { label: 'Inspect', cls: 'b-todo', done: false };
}
function photoCounts(insp) { const pc = {}; photosOf(insp).forEach(p => pc[p.componentId] = (pc[p.componentId] || 0) + 1); return pc; }
function tally(insp, b) {
  const t = { done: 0, def: 0, ok: 0, na: 0, total: b.components.length, photos: photosOf(insp).length }, pc = photoCounts(insp);
  b.components.forEach(c => { const s = statusOf(itemsOf(insp)[c.id], pc[c.id]); if (s.done) t.done++; if (s.def) t.def++; if (s.cls === 'b-ok') t.ok++; if (s.cls === 'b-na') t.na++; });
  return t;
}
function photoNames(insp, b) {
  const compBy = Object.fromEntries(b.components.map(c => [c.id, c])), seen = {}, out = {};
  photosOf(insp).sort((x, y) => String(x.takenAt).localeCompare(String(y.takenAt))).forEach(p => {

function getFix(timeout = 10000) {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) }),
      () => res(null), { enableHighAccuracy: true, timeout, maximumAge: 60000 });
  });
}

/* Admin lock for the Online sync settings. Only a salted SHA-256 of the password is kept here. */
const ADMIN_SALT = '7549a73928a2f18b054740dbe6fd4f6e', ADMIN_HASH = 'd4050ea06e6c6367c7c4152967f5a3a8432e38217b43da55c84d9a6113de034c';

async function adminCheck(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ADMIN_SALT + pw));

}

/* ---------- Set up bridge ---------- */
/* Editing a bridge's set-up keeps everything already recorded: components keep their IDs, and any
   component that the new layout drops is kept if an inspection has findings or photos for it.
   Items added by hand (custom) are always kept. */
function compHasData(bridgeId, cid) {
  return inspectionsFor(bridgeId).some(i => { const it = itemsOf(i)[cid]; return (it && ((it.defects || []).length || it.none || it.na || it.comment)) || photosOf(i, cid).length; });
}
function mergeComponents(b, bid, fresh) {
  const ids = new Set(fresh.map(c => c.id)), out = [...fresh], kept = [];
  for (const c of b.components) {
    if (ids.has(c.id) || !(c.custom || compHasData(bid, c.id))) continue;
    // Place it after the last component of its own location, or else after whatever came before it originally.
    let at = -1; out.forEach((x, k) => { if (x.loc === c.loc) at = k; });
    if (at < 0) { const prev = b.components.slice(0, b.components.indexOf(c)).reverse().find(x => out.includes(x) || ids.has(x.id)); at = prev ? out.findIndex(x => x.id === prev.id) : -1; }
    out.splice(at + 1, 0, c); if (!c.custom) kept.push(c);
  }
  const old = new Set(b.components.map(c => c.id));
  return { list: out, added: fresh.filter(c => !old.has(c.id)).length, kept: kept.length,
    removed: b.components.filter(c => !ids.has(c.id) && !c.custom && !compHasData(bid, c.id)).length };
}
function editForm(b, bid) {

  return f;
}

/* ---------- Component: defects, comments, photos ---------- */
function getDraft(inspId, cid) {
  if (!S.draft || S.draft.inspId !== inspId || S.draft.cid !== cid) {
    const it = itemsOf(Store.get('inspections', inspId))[cid] || {};
    S.draft = { inspId, cid, it: { defects: [...(it.defects || [])], none: !!it.none, na: !!it.na, comment: it.comment || '' } };
  }
  return S.draft;
}
let draftT;
function touchDraft() { clearTimeout(draftT); draftT = setTimeout(flushDraft, 400); }
function flushDraft() {
  clearTimeout(draftT);
  const d = S.draft; if (!d) return;
  const insp = Store.get('inspections', d.inspId); if (!insp) return;
  const prev = itemsOf(insp)[d.cid], next = { ...d.it, defects: [...d.it.defects], updatedAt: now() };
  if (prev && JSON.stringify({ ...prev, updatedAt: 0 }) === JSON.stringify({ ...next, updatedAt: 0 })) return;
  if (!prev && !next.defects.length && !next.none && !next.na && !next.comment) return;
  Store.patch('inspections', d.inspId, { items: { [d.cid]: next } });
}

/* ---------- Photos: downscale, store on device, tag GPS ---------- */
/* The phone keeps every photo at its original size. Copies are shrunk only where size matters:
   the Google Drive upload (5 MB max) and the pictures inside the Word report (2 MB max).
   Shrinking tries full resolution at high quality first, then lower quality, then smaller size. */
const UPLOAD_MAX_BYTES = 5 * 1024 * 1024;   // Google Drive copy
const WORD_MAX_BYTES = 2 * 1024 * 1024;     // picture inside the Word report
const CANVAS_MAX_PX = 16e6;                 // iPhone Safari cannot draw a larger canvas
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a readable image.')); };
    img.src = url;
  });
}
// Re-encode as JPEG no bigger than maxBytes. Returns the input untouched when it already fits.
async function fitPhoto(file, maxBytes = UPLOAD_MAX_BYTES) {
  if (file.size <= maxBytes && file.type === 'image/jpeg') return file;
  const img = await loadImage(file), W = img.naturalWidth, H = img.naturalHeight;
  let dim = Math.round(Math.max(W, H) * Math.min(1, Math.sqrt(CANVAS_MAX_PX / (W * H)))), q = 0.92, blob = null;
  for (let i = 0; i < 12; i++) {
    const k = dim / Math.max(W, H), c = document.createElement('canvas');
    c.width = Math.round(W * k); c.height = Math.round(H * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (!blob) throw new Error('Could not read photo');
    if (blob.size <= maxBytes) return blob;
    if (q > 0.72) q = Math.round((q - 0.06) * 100) / 100; else dim = Math.round(dim * 0.85);
  }
  return blob;
}
// The phone keeps the photo at its original size. Only a photo the browser cannot show as a
// JPEG (e.g. PNG, HEIC on some Androids) is converted, at full resolution.
async function originalPhoto(file) {
  if (file.type === 'image/jpeg' || /\.jpe?g$/i.test(file.name || '')) { await loadImage(file); return file.type === 'image/jpeg' ? file : new Blob([file], { type: 'image/jpeg' }); }
  return fitPhoto(file, Infinity);
}
async function onPhotos(files) {
  if (!files || !files.length || !photoTarget) return;
  const inspId = S.route.id, tgt = photoTarget; photoTarget = null;
  const added = [];
  for (const f of files) {
    try {
      Store.pending++; Store.status();
      const blob = await originalPhoto(f), id = await Store.savePhoto(blob, inspId);
      const t = now();
      await Store.patch('inspections', inspId, { photos: { [id]: { componentId: tgt.cid, takenAt: t, updatedAt: t } } });
      added.push(id);
      // Camera shots are not in the iPhone Photos app yet: keep them ready to hand over when Done is tapped.
      if (tgt.camera) S.newPhotos.push({ id, blob, inspId, cid: tgt.cid });
    } catch (e) { Store.setError('Photo not saved: ' + (e.message || e)); }
    finally { Store.pending--; Store.status(); }
  }
  render(); if (added.length > 1) toast(`${added.length} photos added.`);
  if (added.length && lsGet('bsi-gps', true)) getFix(8000).then(fix => { if (fix) Store.patch('inspections', inspId, { photos: Object.fromEntries(added.map(id => [id, { lat: fix.lat, lng: fix.lng, acc: fix.acc }])) }); });
}

/* =========================================================================
   Handing files to the user: iPhone/Android share sheet (Files, OneDrive, SharePoint, Mail…),
   or a normal download on a computer. Sharing needs a fresh tap, so a ready file waits in a sheet.
   ========================================================================= */
let ready = null;
const canShareFiles = files => { try { return !!(navigator.canShare && navigator.canShare({ files })); } catch { return false; } };
function showSheet(title, size, note, button) {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sheet-in"><div class="row between"><b class="grow" style="overflow-wrap:anywhere">${esc(title)}</b>${size ? `<span class="sub">${size}</span>` : ''}</div>
    <span class="sub">${note}</span>
    <div class="row"><button class="btn grow" data-act="sheet-share">${ICON.share} ${button}</button><button class="btn ghost" data-act="sheet-close">Close</button></div></div>`;
  sh.hidden = false;
}
function offerFile(name, blob) {
  const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
  ready = { name, blob, files: [file] };
  if (canShareFiles([file])) { showSheet(name, fmtSize(blob.size), 'Ready. Share it to Files, OneDrive, SharePoint, Mail or AirDrop.', 'Share / Save'); return; }
  if (isAndroid()) { ready.download = true; showSheet(name, fmtSize(blob.size), 'Ready. It saves to <b>Downloads</b>. Open it from the notification or the Files app, or share it from there to Drive, OneDrive or email.', 'Save to phone'); return; }
  downloadReady();
}
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 15000);
}
function saveImagesToDevice(files) {
  files.forEach((f, i) => setTimeout(() => downloadBlob(f, f.name), i * 450));
  toast(`${files.length} photo${files.length > 1 ? 's' : ''} saved to Downloads (Gallery / Google Photos).`);
}
/* Photos to the iPhone Photos app: the share sheet's "Save Image(s)" puts them in the camera roll;
   "Save to Files" keeps the component file names. */
function offerPhotos(pics, auto) {
  const files = pics.map(x => new File([x.blob], x.file, { type: 'image/jpeg' }));
  if (files.length && isAndroid()) { saveImagesToDevice(files); return; }
  if (!files.length || !canShareFiles(files)) { if (!auto) toast('Saving to Photos needs the iPhone or Android share sheet.'); return; }
  ready = { name: files.length === 1 ? files[0].name : `${files.length} photos`, files, photos: true };
  const one = files.length === 1;
  showSheet(one ? `Save ${files[0].name} to Photos?` : `Save ${files.length} pictures to Photos?`, fmtSize(files.reduce((a, f) => a + f.size, 0)),
    `Tap the button, then <b>Save Image${one ? '' : 's'}</b> to keep ${one ? 'it' : 'them'} in the Photos app, or <b>Save to Files</b> to keep the component file names.`, one ? 'Save to Photos' : `Save ${files.length} to Photos`);
}
async function shareReady() {
  if (!ready) return;
  if (ready.download) { downloadReady(); return; }
  try { await navigator.share({ files: ready.files, title: ready.name }); closeSheet(); if (ready?.photos) toast('Shared.'); }
  catch (e) { if (e && e.name === 'AbortError') return; if (ready.photos) { toast('Could not open the share sheet.'); return; } downloadReady(); }
}
function downloadReady() {
  if (!ready || ready.photos) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(ready.blob); a.download = ready.name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  toast('Saved ' + ready.name); closeSheet();
}
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }

   ========================================================================= */
function findingOf(it) { it = it || {}; return it.na ? 'Not accessible' : (it.defects || []).length ? it.defects.join(', ') : it.none ? 'No defects observed' : ''; }
function captionOf(c, it) {
  const where = c ? [locFull(c.loc), compFull(c)].filter(Boolean).join(' ') : 'Photo';
  const desc = (it?.comment || '').trim().replace(/\s*\n+\s*/g, '; ') || findingOf(it) || 'No defects observed';
  return `${where} - ${desc}`;
}
function orderedPhotos(insp, b) {
  const ix = Object.fromEntries(b.components.map((c, i) => [c.id, i]));
  return photosOf(insp).sort((x, y) => (ix[x.componentId] ?? 1e9) - (ix[y.componentId] ?? 1e9) || String(x.takenAt).localeCompare(String(y.takenAt)));
}
function imgSize(blob) {
  return new Promise(res => { const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { res({ w: im.naturalWidth || 4, h: im.naturalHeight || 3 }); URL.revokeObjectURL(u); };
    im.onerror = () => { res({ w: 4, h: 3 }); URL.revokeObjectURL(u); }; im.src = u; });
}
async function collectPictures(insp, b) {

  const out = []; let missing = 0, n = 0;
  for (const p of orderedPhotos(insp, b)) {
    const blob = await Store.photoBlob(p.id); if (!blob) { missing++; continue; }
    const c = compBy[p.componentId], it = c ? I[c.id] : null;
    out.push({ p, blob, size: await imgSize(blob), n: ++n, file: names[p.id] + '.jpg', c, it, caption: captionOf(c, it) });

}

const xe = s => String(s ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  catch (e) { console.error(e); toast('Word report failed: ' + (e.message || e)); }
}
async function exportPackage(id, photosOnly) {
  const insp = Store.get('inspections', id), b = insp && Store.get('bridges', insp.bridgeId); if (!b) return;
  toast(photosOnly ? 'Collecting pictures…' : 'Building export…');
  try {
    const root = pkgName(insp, b) + (insp.status === 'complete' ? '' : '-draft') + (photosOnly ? '_Photos' : '');
    const zip = new JSZip(), dir = zip.folder(root), pf = photosOnly ? dir : dir.folder('Photos');
    const collected = await collectPictures(insp, b);
    const rows = [['Picture', 'File', 'Caption', 'Component ID', 'Location', 'Component', 'Defects observed', 'Comments', 'Taken', 'Latitude', 'Longitude']];
    for (const x of collected.pics) {
      pf.file(x.file, x.blob);
      rows.push([x.n, x.file, `Picture ${x.n}: ${x.caption}`, x.c ? x.c.code : '', x.c ? locFull(x.c.loc) || 'General' : '', x.c ? compFull(x.c) : '', findingOf(x.it), x.it?.comment || '', x.p.takenAt ? new Date(x.p.takenAt).toLocaleString('en-AU') : '', x.p.lat ?? '', x.p.lng ?? '']);
    }
    dir.file('Picture index.csv', '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'));
    if (!photosOnly) {
      const d = await buildDocx(id, collected); dir.file(d.name, d.blob);
      dir.file(root + '.json', JSON.stringify(jsonData(id), null, 2));
    }
    offerFile(root + '.zip', await zip.generateAsync({ type: 'blob', mimeType: 'application/zip' }));
    if (collected.missing) toast(`${collected.missing} photo${collected.missing > 1 ? 's' : ''} could not be read and were left out.`);
  } catch (e) { console.error(e); toast('Export failed: ' + (e.message || e)); }
}

/* ---------- Full backup and restore ---------- */
async function backupAll() {
  toast('Building backup…');
  try {
    const day = now().slice(0, 10), root = `BridgeInspect-backup-${day}`, zip = new JSZip(), dir = zip.folder(root), pd = dir.folder('photos');
    const data = { app: 'bridge-site-inspection', version: 1, exportedAt: now(), bridges: Store.cache.bridges, inspections: Store.cache.inspections };
    let n = 0;
    for (const id of await IDB.keys('photos')) { const r = await IDB.get('photos', id); if (r?.blob) { pd.file(id + '.jpg', r.blob); n++; } }
    dir.file('data.json', JSON.stringify(data, null, 1));
    offerFile(root + '.zip', await zip.generateAsync({ type: 'blob', mimeType: 'application/zip' }));
    toast(`Backup ready: ${Object.keys(data.bridges).length} bridges, ${Object.keys(data.inspections).length} inspections, ${n} photos.`);
  } catch (e) { console.error(e); toast('Backup failed: ' + (e.message || e)); }
}
$('#restore-in').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const z = await JSZip.loadAsync(f), dj = z.file(/(^|\/)data\.json$/)[0];
    if (!dj) throw new Error('This is not a Bridge Site Inspection backup (no data.json inside).');
    const data = JSON.parse(await dj.async('string'));
    if (data.app !== 'bridge-site-inspection') throw new Error('This file is not a backup from this app.');
    const photos = z.file(/(^|\/)photos\/[^/]+\.jpg$/);
    S.restore = { data, zip: z, photoFiles: photos, photos: photos.length };
  } catch (err) { S.restore = { error: 'Could not read that backup: ' + (err.message || err) }; }
  render();
});
async function applyRestore() {
  const r = S.restore; if (!r || r.error) return;
  toast('Restoring…');
  try {
    for (const pf of r.photoFiles) { const id = pf.name.split('/').pop().replace(/\.jpg$/, ''); await IDB.put('photos', id, { blob: await pf.async('blob').then(b => new Blob([b], { type: 'image/jpeg' })), at: now() }); }
    for (const [id, v] of Object.entries(r.data.bridges || {})) await IDB.put('bridges', id, v);
    for (const [id, v] of Object.entries(r.data.inspections || {})) await IDB.put('inspections', id, v);
    const keep = m => Object.fromEntries(Object.entries(m).filter(([, v]) => v && !v._deleted));
    Store.cache.bridges = keep(await IDB.all('bridges')); Store.cache.inspections = keep(await IDB.all('inspections'));
    await Sync.queueAll();
    S.restore = null; render(); toast('Backup restored.'); Sync.soon(1000);
  } catch (e) { console.error(e); Store.setError('Restore failed: ' + (e.message || e)); }
}

/* ---------- Android install prompt ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.route.name === 'home') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Installed. Open Bridge Inspect from your home screen.'); if (S.route.name === 'home') render(); });

/* ---------- Boot ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline mode not available:', e));
Store.init().then(() => { render(); Sync.soon(800); }).catch(e => { console.error(e); $('#view').innerHTML = `<div class="card warn"><b>This browser blocked on-device storage.</b><span class="sub">${esc(e.message || e)}. Turn off private browsing, or open the installed app from its home-screen icon.</span></div>`; });
</script>
